# Build the pdoc API documentation on every push and pull request, and publish
# it to GitHub Pages on pushes to main (https://lsdolab.github.io/aframe/).

name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# one Pages deployment at a time; don't cancel a deployment in progress
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: pyproject.toml

    # PyVista is imported to document the plotting helpers
    - name: Set up headless display
      uses: pyvista/setup-headless-display-action@v3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CSDL_alpha is not on PyPI
        pip install git+https://github.com/LSDOlab/CSDL_alpha.git
        pip install -e ".[plot,docs]"

    - name: Build documentation
      run: python docs/make_docs.py -o site

    - uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    # only the main branch is published
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
