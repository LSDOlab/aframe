# Run the aframe test suite on pushes and pull requests to main.

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the Python versions CSDL_alpha is tested on
        python-version: ["3.9", "3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # virtual display for the off-screen PyVista plotting test
    - name: Set up headless display
      uses: pyvista/setup-headless-display-action@v3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CSDL_alpha is not on PyPI
        pip install git+https://github.com/LSDOlab/CSDL_alpha.git
        # optional: runs the JAX backend test (tests/test_jax.py)
        pip install jax
        pip install -e ".[dev,plot]"

    - name: Test with pytest
      run: pytest
